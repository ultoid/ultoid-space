<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultoid Game Admin</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='js/css/ultoid-theme.css') }}">
    <script>
        const savedTheme = localStorage.getItem('ultoid_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* ─── JEMBATAN VARIABEL (MAPPING KE TEMA ULTOID) ─── */
        :root {
            --bg:        var(--bg-base, #07090f);
            --glass:     var(--glass-bg, rgba(255,255,255,0.04));
            --border:    var(--glass-border, rgba(255,255,255,0.08));
            --border-h:  var(--glass-hover, rgba(255,255,255,0.13));
            --text:      var(--text-primary, #f1f5f9);
            --muted:     var(--text-muted, #64748b);
            /* Modifikasi aksen khusus halaman admin game menjadi UNGU */
            --accent:    #a855f7; 
            --accent2:   #9333ea;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
        }
        
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: var(--border-h); border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen flex flex-col p-4 md:p-8 custom-scroll">
    <div class="max-w-6xl w-full mx-auto">
        
        <div class="flex justify-between items-center mb-8 border-b border-white/10 pb-4">
            <div>
                <a href="/emulator" class="text-xs text-gray-400 hover:text-white transition flex items-center gap-2 mb-1">
                    &larr; Kembali ke Lobi Switch
                </a>
                <h1 class="text-2xl font-bold tracking-tight">Game Center <span style="color: var(--accent);">Admin</span></h1>
            </div>
            <div class="u-glass text-xs text-gray-400 px-4 py-2 rounded-xl">
                Modul Manajemen Game 🎮
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="u-glass rounded-2xl p-6 lg:col-span-1 h-fit shadow-2xl">
                <h2 class="text-lg font-bold mb-4 flex items-center gap-2">➕ <span id="formModeText">Tambah Game Baru</span></h2>
                <form id="gameForm" onsubmit="saveGame(event)" class="flex flex-col gap-3 text-sm">
                    <input type="hidden" id="gameId">
                    
                    <div>
                        <label class="block text-gray-400 text-xs mb-1">Judul Game</label>
                        <input type="text" id="title" placeholder="Contoh: Pokemon Emerald" class="u-input w-full px-3 py-2" required>
                    </div>
                    
                    <div>
                        <label class="block text-gray-400 text-xs mb-1">Konsol / Sistem</label>
                        <input type="text" id="system" placeholder="Contoh: GBA, PS1, N64" class="u-input w-full px-3 py-2" required>
                    </div>

                    <div>
                        <label class="block text-gray-400 text-xs mb-1">Play URL (Akses Direct RomM)</label>
                        <input type="url" id="playUrl" placeholder="http://202.74.74.151:8081/rom/..." class="u-input w-full px-3 py-2" required>
                    </div>

                    <div class="my-2 border-t border-white/10"></div>
                    <p class="text-[10px] text-gray-400 italic mb-2 text-center">Pilih salah satu metode gambar di bawah:</p>

                    <div>
                        <label class="block text-blue-400 text-xs mb-1 font-bold">▶ Opsi A: Auto Scrape Pokeharbor URL</label>
                        <input type="url" id="pokeharborUrl" placeholder="https://www.pokeharbor.com/..." class="u-input w-full px-3 py-2" style="background: rgba(59,130,246,0.1); border-color: rgba(59,130,246,0.3);">
                    </div>

                    <div class="text-center text-xs text-gray-500 my-1 font-bold">ATAU MANUAL</div>

                    <div class="flex flex-col gap-3">
                        <div>
                            <label class="block text-purple-400 text-xs mb-1 font-bold">▶ Opsi B: Cover Image URL (Poster)</label>
                            <input type="url" id="cover" class="u-input w-full px-3 py-2" style="background: rgba(168,85,247,0.1); border-color: rgba(168,85,247,0.3);">
                        </div>
                        <div>
                            <label class="block text-purple-400 text-xs mb-1 font-bold">▶ Opsi B: Background Image URL</label>
                            <input type="url" id="bg" class="u-input w-full px-3 py-2" style="background: rgba(168,85,247,0.1); border-color: rgba(168,85,247,0.3);">
                        </div>
                    </div>

                    <div class="flex gap-2 mt-4">
                        <button type="submit" class="u-btn u-btn-primary flex-1 py-2 rounded-lg transition shadow-lg text-center justify-center">Simpan</button>
                        <button type="button" onclick="resetForm()" class="u-btn u-btn-ghost py-2 px-4 rounded-lg transition">Batal</button>
                    </div>
                </form>
            </div>

            <div class="u-glass rounded-2xl p-6 lg:col-span-2 overflow-x-auto shadow-2xl">
                <h2 class="text-lg font-bold mb-4">🗂️ Daftar Game di Lobi</h2>
                <table class="w-full text-left border-collapse min-w-[600px]">
                    <thead>
                        <tr class="border-b border-white/20 text-gray-400 text-xs uppercase tracking-widest">
                            <th class="pb-3 pl-2">Konsol</th>
                            <th class="pb-3">Judul Game</th>
                            <th class="pb-3">Metode Gambar</th>
                            <th class="pb-3 text-right pr-2">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="gameTableBody" class="text-sm">
                        </tbody>
                </table>
            </div>
            
        </div>
    </div>

    <script>
        let games = [];

        async function fetchGames() {
            try {
                const res = await fetch('/api/custom_games');
                games = await res.json();
                renderTable();
            } catch(e) { console.error("Gagal menarik data", e); }
        }

        function renderTable() {
            const tbody = document.getElementById('gameTableBody');
            tbody.innerHTML = '';
            
            if(games.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="text-center py-6 text-gray-500 italic text-xs">Belum ada game. Tambahkan di sebelah kiri.</td></tr>`;
                return;
            }

            games.forEach(g => {
                const tr = document.createElement('tr');
                tr.className = 'border-b border-white/5 hover:bg-white/5 transition';
                
                const imageMethod = g.pokeharborUrl 
                    ? '<span class="bg-blue-500/20 text-blue-300 border border-blue-500/30 px-2 py-0.5 rounded-full text-[10px] font-bold tracking-wider">Pokeharbor</span>' 
                    : '<span class="bg-purple-500/20 text-purple-300 border border-purple-500/30 px-2 py-0.5 rounded-full text-[10px] font-bold tracking-wider">Manual URL</span>';
                
                let icon = "🎮";
                let sysLower = g.system.toLowerCase();
                if(sysLower.includes('gba') || sysLower.includes('gameboy')) icon = "📱";
                else if(sysLower.includes('ps1') || sysLower.includes('playstation')) icon = "💿";
                else if(sysLower.includes('n64')) icon = "🕹️";

                tr.innerHTML = `
                    <td class="py-3 pl-2 text-gray-300 font-bold text-xs uppercase tracking-wide flex items-center gap-2"><span class="text-lg">${icon}</span> ${g.system}</td>
                    <td class="py-3 font-bold text-white">${g.title}</td>
                    <td class="py-3">${imageMethod}</td>
                    <td class="py-3 text-right pr-2">
                        <button onclick='editGame(${JSON.stringify(g).replace(/'/g, "&apos;")})' class="u-btn u-btn-ghost px-3 py-1.5 rounded-lg text-xs mr-2 transition font-bold" style="color: #60a5fa; border-color: rgba(96,165,250,0.3);">Edit</button>
                        <button onclick="deleteGame(${g.id})" class="u-btn u-btn-danger px-3 py-1.5 rounded-lg text-xs transition font-bold">Hapus</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function editGame(g) {
            document.getElementById('formModeText').innerText = "Edit Game";
            document.getElementById('gameId').value = g.id;
            document.getElementById('title').value = g.title;
            document.getElementById('system').value = g.system;
            document.getElementById('playUrl').value = g.playUrl;
            document.getElementById('pokeharborUrl').value = g.pokeharborUrl || '';
            document.getElementById('cover').value = g.cover || '';
            document.getElementById('bg').value = g.bg || '';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetForm() {
            document.getElementById('formModeText').innerText = "Tambah Game Baru";
            document.getElementById('gameId').value = '';
            document.getElementById('gameForm').reset();
        }

        async function saveGame(e) {
            e.preventDefault();
            const idVal = document.getElementById('gameId').value;
            const newGame = {
                id: idVal ? parseInt(idVal) : Date.now(),
                title: document.getElementById('title').value,
                system: document.getElementById('system').value.toUpperCase(),
                playUrl: document.getElementById('playUrl').value,
                pokeharborUrl: document.getElementById('pokeharborUrl').value,
                cover: document.getElementById('cover').value,
                bg: document.getElementById('bg').value
            };

            if (idVal) {
                const idx = games.findIndex(g => g.id == parseInt(idVal));
                if(idx > -1) games[idx] = newGame;
            } else {
                games.push(newGame);
            }

            await syncToServer();
            resetForm();
        }

        async function deleteGame(id) {
            if(!confirm("Yakin ingin menghapus game ini dari Lobi?")) return;
            games = games.filter(g => g.id !== id);
            await syncToServer();
        }

        async function syncToServer() {
            try {
                await fetch('/api/custom_games', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(games)
                });
                renderTable();
            } catch(e) { alert("Gagal menyimpan ke server VPS!"); }
        }

        fetchGames();
    </script>
</body>
</html>
