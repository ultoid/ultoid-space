<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultoid Game Admin</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='js/css/ultoid-theme.css') }}">
    <script>
        const savedTheme = localStorage.getItem('ultoid_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* ─── JEMBATAN VARIABEL (MAPPING KE TEMA ULTOID) ─── */
        :root {
            --bg:        var(--bg-base, #07090f);
            --glass:     var(--glass-bg, rgba(255,255,255,0.04));
            --border:    var(--glass-border, rgba(255,255,255,0.08));
            --border-h:  var(--glass-hover, rgba(255,255,255,0.13));
            --text:      var(--text-primary, #f1f5f9);
            --muted:     var(--text-muted, #64748b);
            /* Modifikasi aksen khusus halaman admin game menjadi UNGU */
            --accent:    #a855f7; 
            --accent2:   #9333ea;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
        }
        
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: var(--border-h); border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen flex flex-col custom-scroll">

    <nav class="u-glass sticky top-0 z-50 px-5 py-3" style="border-radius:0; border-top:none; border-left:none; border-right:none; background: rgba(7,9,15,0.7);">
        <div class="max-w-6xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-3">
            <div class="flex items-center gap-3 w-full sm:w-auto">
                <a href="/space" title="Home" class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-white/10 transition text-base">🤖</a>
                <div class="w-px h-5 bg-white/10"></div>
                <a href="/emulator" class="u-btn u-btn-ghost text-xs py-1.5 px-3">← Emulator</a>
                <div class="w-px h-5 bg-white/10"></div>
                <span class="text-sm font-semibold tracking-tight">Game Center <span style="color: var(--accent);">Admin</span></span>
            </div>
            <div class="flex items-center gap-2 w-full sm:w-auto justify-start sm:justify-end">
                <div class="u-glass text-xs text-gray-400 px-4 py-2 rounded-xl">
                    Modul Manajemen Game 🎮
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-1 p-4 md:p-8 max-w-6xl w-full mx-auto">

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="u-glass rounded-2xl p-6 lg:col-span-1 h-fit shadow-2xl">
                <h2 class="text-lg font-bold mb-4 flex items-center gap-2">➕ <span id="formModeText">Tambah Game Baru</span></h2>
                <form id="gameForm" onsubmit="saveGame(event)" class="flex flex-col gap-3 text-sm" enctype="multipart/form-data">
                    <input type="hidden" id="gameId">
                    <input type="hidden" id="existingRom">
                    
                    <div>
                        <label class="block text-gray-400 text-xs mb-1">Judul Game</label>
                        <input type="text" id="title" placeholder="Contoh: Pokemon Emerald" class="u-input w-full px-3 py-2" required>
                    </div>
                    
                    <div>
                        <label class="block text-gray-400 text-xs mb-1">Konsol / Sistem</label>
                        <select id="system" class="u-input w-full px-3 py-2" required>
                            <option value="GBA">Game Boy Advance (GBA)</option>
                            <option value="GBC">Game Boy Color (GBC)</option>
                            <option value="GB">Game Boy (GB)</option>
                            <option value="NDS">Nintendo DS (NDS)</option>
                            <option value="NES">Nintendo (NES)</option>
                            <option value="SNES">Super Nintendo (SNES)</option>
                            <option value="N64">Nintendo 64 (N64)</option>
                            <option value="PSX">PlayStation 1 (PSX)</option>
                            <option value="SEGAMD">Sega Mega Drive / Genesis</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-gray-400 text-xs mb-1">File ROM (Upload)</label>
                        <input type="file" id="romFile" class="u-input w-full px-3 py-2 text-gray-400">
                        <p class="text-[10px] text-gray-500 mt-1" id="romHelp">Pilih file ROM (.gba, .nes, .iso, zip dll). <span class="text-yellow-500 hidden" id="romEditHelp">Abaikan jika tidak ingin mengganti ROM lama.</span></p>
                    </div>

                    <div class="my-2 border-t border-white/10"></div>
                    <p class="text-[10px] text-gray-400 italic mb-2 text-center">Tampilan Gambar (Opsional)</p>

                    <div class="flex flex-col gap-3">
                        <div>
                            <label class="block text-purple-400 text-xs mb-1 font-bold">Cover Image (Upload atau URL)</label>
                            <div class="flex gap-2">
                                <input type="file" id="coverFile" accept="image/*" class="u-input w-1/2 px-2 py-1 text-xs">
                                <input type="url" id="coverUrl" placeholder="Atau paste URL" class="u-input w-1/2 px-2 py-1 text-xs" style="background: rgba(168,85,247,0.1); border-color: rgba(168,85,247,0.3);">
                            </div>
                        </div>
                        <div>
                            <label class="block text-purple-400 text-xs mb-1 font-bold">Background Image (Upload atau URL)</label>
                            <div class="flex gap-2">
                                <input type="file" id="bgFile" accept="image/*" class="u-input w-1/2 px-2 py-1 text-xs">
                                <input type="url" id="bgUrl" placeholder="Atau paste URL" class="u-input w-1/2 px-2 py-1 text-xs" style="background: rgba(168,85,247,0.1); border-color: rgba(168,85,247,0.3);">
                            </div>
                        </div>
                    </div>

                    <div class="flex gap-2 mt-4">
                        <button type="submit" id="saveBtn" class="u-btn u-btn-primary flex-1 py-2 rounded-lg transition shadow-lg text-center justify-center">Simpan</button>
                        <button type="button" onclick="resetForm()" class="u-btn u-btn-ghost py-2 px-4 rounded-lg transition">Batal</button>
                    </div>
                </form>
            </div>

            <div class="u-glass rounded-2xl p-6 lg:col-span-2 overflow-x-auto shadow-2xl">
                <h2 class="text-lg font-bold mb-4">🗂️ Daftar Game di Lobi</h2>
                <table class="w-full text-left border-collapse min-w-[600px]">
                    <thead>
                        <tr class="border-b border-white/20 text-gray-400 text-xs uppercase tracking-widest">
                            <th class="pb-3 pl-2">Konsol</th>
                            <th class="pb-3">Judul Game</th>
                            <th class="pb-3">Metode Gambar</th>
                            <th class="pb-3 text-right pr-2">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="gameTableBody" class="text-sm">
                        </tbody>
                </table>
            </div>
            
        </div>
        </div>
    </main>

    <script>
        let games = [];

        async function fetchGames() {
            try {
                const res = await fetch('/api/custom_games');
                games = await res.json();
                renderTable();
            } catch(e) { console.error("Gagal menarik data", e); }
        }

        function renderTable() {
            const tbody = document.getElementById('gameTableBody');
            tbody.innerHTML = '';
            
            if(games.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="text-center py-6 text-gray-500 italic text-xs">Belum ada game. Tambahkan di sebelah kiri.</td></tr>`;
                return;
            }

            games.forEach(g => {
                const tr = document.createElement('tr');
                tr.className = 'border-b border-white/5 hover:bg-white/5 transition';
                
                const imageMethod = g.cover 
                    ? '<span class="bg-purple-500/20 text-purple-300 border border-purple-500/30 px-2 py-0.5 rounded-full text-[10px] font-bold tracking-wider">Custom Image</span>' 
                    : '<span class="bg-gray-500/20 text-gray-300 border border-gray-500/30 px-2 py-0.5 rounded-full text-[10px] font-bold tracking-wider">Tanpa Gambar</span>';
                
                let icon = "🎮";
                let sysLower = g.system.toLowerCase();
                if(sysLower.includes('gba') || sysLower.includes('gameboy') || sysLower.includes('gbc') || sysLower.includes('gb')) icon = "📱";
                else if(sysLower.includes('ps1') || sysLower.includes('psx') || sysLower.includes('playstation')) icon = "💿";
                else if(sysLower.includes('n64')) icon = "🕹️";
                else if(sysLower.includes('nds')) icon = "📟";

                tr.innerHTML = `
                    <td class="py-3 pl-2 text-gray-300 font-bold text-xs uppercase tracking-wide flex items-center gap-2"><span class="text-lg">${icon}</span> ${g.system}</td>
                    <td class="py-3 font-bold text-white">${g.title}</td>
                    <td class="py-3">${imageMethod}</td>
                    <td class="py-3 text-right pr-2">
                        <button onclick='editGame(${JSON.stringify(g).replace(/'/g, "&apos;")})' class="u-btn u-btn-ghost px-3 py-1.5 rounded-lg text-xs mr-2 transition font-bold" style="color: #60a5fa; border-color: rgba(96,165,250,0.3);">Edit</button>
                        <button onclick="deleteGame(${g.id})" class="u-btn u-btn-danger px-3 py-1.5 rounded-lg text-xs transition font-bold">Hapus</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function editGame(g) {
            document.getElementById('formModeText').innerText = "Edit Game";
            document.getElementById('gameId').value = g.id;
            document.getElementById('existingRom').value = g.rom || '';
            document.getElementById('title').value = g.title;
            document.getElementById('system').value = g.system;
            document.getElementById('romEditHelp').classList.remove('hidden');
            
            document.getElementById('coverUrl').value = g.cover || '';
            document.getElementById('bgUrl').value = g.bg || '';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetForm() {
            document.getElementById('formModeText').innerText = "Tambah Game Baru";
            document.getElementById('gameId').value = '';
            document.getElementById('existingRom').value = '';
            document.getElementById('romEditHelp').classList.add('hidden');
            document.getElementById('gameForm').reset();
        }

        async function uploadFile(fileInput, endpoint, paramName) {
            if (!fileInput.files || fileInput.files.length === 0) return null;
            const formData = new FormData();
            formData.append(paramName, fileInput.files[0]);
            const res = await fetch(endpoint, { method: 'POST', body: formData });
            const data = await res.json();
            if (data.success) {
                return data.filename || data.url;
            }
            throw new Error(data.error || 'Upload gagal');
        }

        async function saveGame(e) {
            e.preventDefault();
            const btn = document.getElementById('saveBtn');
            btn.disabled = true;
            btn.innerText = "⏳ Menyimpan...";

            try {
                const idVal = document.getElementById('gameId').value;
                const generatedId = idVal ? parseInt(idVal) : Date.now();
                
                let romFilename = document.getElementById('existingRom').value;
                
                // Upload ROM if provided
                const romFileInput = document.getElementById('romFile');
                if (romFileInput.files.length > 0) {
                    btn.innerText = "⏳ Uploading ROM...";
                    romFilename = await uploadFile(romFileInput, '/api/emulator/upload_rom', 'rom_file');
                }

                if (!romFilename) {
                    alert("Harap pilih file ROM!");
                    throw new Error("No ROM");
                }

                // Upload Cover if provided
                let coverValue = document.getElementById('coverUrl').value;
                const coverFileInput = document.getElementById('coverFile');
                if (coverFileInput.files.length > 0) {
                    btn.innerText = "⏳ Uploading Cover...";
                    coverValue = await uploadFile(coverFileInput, '/api/emulator/upload_image', 'image');
                }

                // Upload BG if provided
                let bgValue = document.getElementById('bgUrl').value;
                const bgFileInput = document.getElementById('bgFile');
                if (bgFileInput.files.length > 0) {
                    btn.innerText = "⏳ Uploading Background...";
                    bgValue = await uploadFile(bgFileInput, '/api/emulator/upload_image', 'image');
                }

                const newGame = {
                    id: generatedId,
                    title: document.getElementById('title').value,
                    system: document.getElementById('system').value.toUpperCase(),
                    rom: romFilename,
                    playUrl: '/play/' + generatedId,
                    cover: coverValue,
                    bg: bgValue
                };

                if (idVal) {
                    const idx = games.findIndex(g => g.id == parseInt(idVal));
                    if(idx > -1) games[idx] = newGame;
                } else {
                    games.push(newGame);
                }

                await syncToServer();
                resetForm();
            } catch(err) {
                if(err.message !== "No ROM") alert("Gagal: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "Simpan";
            }
        }

        async function deleteGame(id) {
            if(!confirm("Yakin ingin menghapus game ini dari Lobi?")) return;
            games = games.filter(g => g.id !== id);
            await syncToServer();
        }

        async function syncToServer() {
            try {
                await fetch('/api/custom_games', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(games)
                });
                renderTable();
            } catch(e) { alert("Gagal menyimpan ke server VPS!"); }
        }

        document.getElementById('romFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            const filename = file.name;
            const lastDotIdx = filename.lastIndexOf('.');
            
            let nameWithoutExt = filename;
            let ext = "";
            if (lastDotIdx !== -1) {
                nameWithoutExt = filename.substring(0, lastDotIdx);
                ext = filename.substring(lastDotIdx + 1).toLowerCase();
            }

            const titleInput = document.getElementById('title');
            if (!titleInput.value) {
                // Bersihkan nama file (hapus underscore, dash, dll)
                let cleanName = nameWithoutExt.replace(/[-_]/g, ' ').replace(/\s+/g, ' ').trim();
                // Hapus versi region dalam kurung jika ada (misal: (USA), (Europe))
                cleanName = cleanName.replace(/\s*\(.*?\)/g, '');
                cleanName = cleanName.replace(/\s*\[.*?\]/g, '');
                titleInput.value = cleanName.trim();
            }

            const systemSelect = document.getElementById('system');
            let sysVal = "";
            if (ext === 'gba') sysVal = "GBA";
            else if (ext === 'gbc') sysVal = "GBC";
            else if (ext === 'gb') sysVal = "GB";
            else if (ext === 'nds') sysVal = "NDS";
            else if (ext === 'nes' || ext === 'fc') sysVal = "NES";
            else if (ext === 'sfc' || ext === 'smc') sysVal = "SNES";
            else if (ext === 'n64' || ext === 'z64') sysVal = "N64";
            else if (ext === 'iso' || ext === 'bin' || ext === 'img' || ext === 'chd') sysVal = "PSX";
            else if (ext === 'md' || ext === 'gen' || ext === 'smd') sysVal = "SEGAMD";

            if (sysVal) {
                systemSelect.value = sysVal;
            }
        });

        fetchGames();
    </script>
</body>
</html>
