<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ultoid Game Center</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='js/css/ultoid-theme.css') }}">
    <script>
        const savedTheme = localStorage.getItem('ultoid_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        #switchBg { transition: background-image 0.5s ease-in-out; }
        /* CATATAN: Styling .u-game-card dan .u-game-card.active sekarang diambil dari ultoid-theme.css! */
    </style>
</head>
<body class="bg-black text-white font-sans flex flex-col h-[100dvh] w-full overflow-hidden overscroll-none selection:bg-indigo-500 selection:text-white relative">

    <div id="loadingOverlay" class="fixed inset-0 z-[200] bg-black flex flex-col items-center justify-center text-white transition-opacity duration-500">
        <div class="text-6xl animate-bounce mb-4">👾</div>
        <h2 class="text-xl font-bold animate-pulse">Menyiapkan Lobi...</h2>
    </div>

    <div id="switchBg" class="absolute inset-0 bg-cover bg-center opacity-40 blur-lg transform scale-110 pointer-events-none"></div>
    <div class="absolute inset-0 bg-gradient-to-t from-black via-black/40 to-black/80 pointer-events-none"></div>

    <div class="relative z-10 flex justify-between items-center p-4 md:px-12 md:py-6 w-full flex-shrink-0">
        <div></div> <div class="flex gap-3 md:gap-4 items-center text-white font-bold tracking-wide text-xs md:text-base drop-shadow-md">
            <span id="switchClock">12:00 PM</span>
            <span>📶</span>
            <span>100% 🔋</span>
        </div>
    </div>

    <div id="consoleFilters" class="relative z-10 flex gap-3 md:gap-4 overflow-x-auto hide-scroll justify-center px-4 py-2 w-full flex-shrink-0">
        </div>

    <div class="relative z-10 flex justify-center w-full px-6 mb-4 md:mb-6 mt-1 md:mt-2 flex-shrink-0">
        <div class="w-full max-w-[220px] md:max-w-md relative">
            <input type="text" id="searchInput" oninput="handleSearch()" placeholder="Cari game..." 
                   class="u-input w-full px-4 py-1.5 md:py-2 text-xs md:text-sm text-white pl-9 shadow-inner">
            <span class="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400 text-xs md:text-sm">🔍</span>
        </div>
    </div>

    <div class="relative z-10 flex-1 flex flex-col justify-center overflow-hidden w-full min-h-0">
        <div id="gameCarousel" class="flex gap-6 overflow-x-auto hide-scroll px-[50vw] snap-x snap-mandatory scroll-smooth items-center h-60 md:h-80 w-full touch-pan-x"></div>
        
        <div class="text-center mt-6 md:mt-8 transition-all duration-300 min-h-[5rem] md:min-h-[7rem] px-4 flex-shrink-0 flex flex-col justify-center items-center">
            <h1 id="activeGameTitle" class="text-2xl sm:text-3xl md:text-4xl lg:text-5xl font-bold text-white drop-shadow-lg tracking-tight leading-normal pb-2 px-2 max-w-5xl text-wrap">Memuat...</h1>
            <p id="activeGameSystem" class="text-gray-400 mt-1 md:mt-2 font-medium tracking-widest uppercase text-[10px] md:text-sm drop-shadow-md">Console</p>
        </div>
    </div>

    <div class="relative z-10 flex justify-between items-center px-4 md:px-8 py-3 md:py-4 border-t border-white/20 bg-black/50 backdrop-blur-md w-full flex-shrink-0">
        <div class="flex gap-3 md:gap-4">
            <a href="/space" class="u-btn u-btn-ghost flex items-center gap-1.5 md:gap-2 text-white hover:text-red-400 transition font-medium text-xs md:text-base border-none">
                <div class="w-6 h-6 md:w-8 md:h-8 rounded-full bg-white/20 flex items-center justify-center font-bold text-[10px] md:text-sm border border-white/30">B</div> <span class="hidden sm:inline">Space</span>
            </a>
            <a href="/game-admin" class="u-btn u-btn-ghost flex items-center gap-1.5 md:gap-2 text-white hover:text-purple-400 transition font-medium text-xs md:text-base border-none">
                <div class="w-6 h-6 md:w-8 md:h-8 rounded-full bg-purple-500/20 flex items-center justify-center text-[10px] md:text-sm border border-purple-500/50">⚙️</div> <span class="hidden sm:inline">Admin</span>
            </a>
        </div>
        
        <div class="flex items-center">
            <button onclick="toggleFavorite()" id="btnFavorite" class="flex items-center gap-1 md:gap-1.5 text-white hover:text-pink-400 transition font-bold text-[10px] md:text-sm cursor-pointer mr-3 md:mr-6 border border-white/20 px-3 md:px-4 py-1.5 md:py-2 rounded-full bg-black/30 shadow-md">
                🤍 <span class="hidden sm:inline">Favorit</span>
            </button>
            <button onclick="playActiveGame()" class="u-btn u-btn-primary flex items-center gap-1.5 md:gap-2 text-white transition font-medium text-xs md:text-base cursor-pointer">
                <div class="w-6 h-6 md:w-8 md:h-8 rounded-full bg-white text-black flex items-center justify-center font-bold text-[10px] md:text-sm shadow-md border border-white">A</div> Mainkan
            </button>
        </div>
    </div>

    <script>
        let allGames = [];
        let filteredGames = [];
        let activeGameIndex = 0;
        let currentFilter = 'All';
        let searchQuery = '';

        async function fetchGameDatabase() {
            try {
                const res = await fetch('/api/custom_games');
                allGames = await res.json();
                
                document.getElementById('loadingOverlay').classList.add('opacity-0');
                setTimeout(() => document.getElementById('loadingOverlay').classList.add('hidden'), 300);

                renderFilters();
                applyFilter('All');
                backgroundScrapeAndSave();
            } catch(e) { console.error(e); }
        }

        async function backgroundScrapeAndSave() {
            let hasNewData = false;
            const scrapeTasks = allGames.map(async (game) => {
                if (game.pokeharborUrl && (!game.cover || game.cover === "")) {
                    try {
                        let res = await fetch('/api/scrape-pokeharbor', {
                            method: 'POST', headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({url: game.pokeharborUrl})
                        });
                        let data = await res.json();
                        if (data.success) { 
                            game.title = data.title; game.cover = data.cover; game.bg = data.bg; 
                            hasNewData = true;
                            applyFilter(currentFilter, true); 
                        }
                    } catch(e) {}
                }
            });

            await Promise.all(scrapeTasks);
            if (hasNewData) saveGamesToServer();
        }

        async function saveGamesToServer() {
            try {
                await fetch('/api/custom_games', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(allGames)
                });
            } catch(e) { console.error("Gagal menyimpan ke server", e); }
        }

        // --- SISTEM PENCARIAN ---
        function handleSearch() {
            searchQuery = document.getElementById('searchInput').value.toLowerCase();
            applyFilter(currentFilter);
        }

        // --- SISTEM FAVORIT ---
        function toggleFavorite() {
            if(filteredGames.length === 0) return;
            const game = filteredGames[activeGameIndex];
            
            game.favorite = !game.favorite; 
            
            updateFavoriteUI();
            saveGamesToServer(); 
            
            if(currentFilter === 'Favorites' && !game.favorite) {
                setTimeout(() => applyFilter(currentFilter), 300);
            }
        }

        function updateFavoriteUI() {
            const btn = document.getElementById('btnFavorite');
            if(filteredGames.length === 0) {
                btn.style.display = 'none'; return;
            }
            btn.style.display = 'flex';
            
            const game = filteredGames[activeGameIndex];
            if(game.favorite) {
                btn.innerHTML = `❤️ <span class="hidden sm:inline">Difavoritkan</span>`;
                btn.classList.add('text-pink-400', 'border-pink-500/50', 'bg-pink-500/20');
                btn.classList.remove('text-white', 'border-white/20', 'bg-black/30');
            } else {
                btn.innerHTML = `🤍 <span class="hidden sm:inline">Favorit</span>`;
                btn.classList.remove('text-pink-400', 'border-pink-500/50', 'bg-pink-500/20');
                btn.classList.add('text-white', 'border-white/20', 'bg-black/30');
            }
        }

        function renderFilters() {
            const container = document.getElementById('consoleFilters');
            container.innerHTML = '';
            
            const systems = ['All', 'Favorites', ...new Set(allGames.map(g => g.system))];
            // Menggunakan URL Repositori persis seperti file Master sebelumnya
            const repoBase = "https://raw.githubusercontent.com/KyleBing/retro-game-console-icons/refs/heads/main/series_trimui/300w%401x/";

            systems.forEach(sys => {
                const btn = document.createElement('button');
                const isActive = sys === currentFilter;
                let iconContent = "";
                
                if(sys === 'All') {
                    iconContent = `<span class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-xl md:text-2xl drop-shadow-lg leading-none mt-[2px]">🌟</span>`;
                } else if(sys === 'Favorites') {
                    iconContent = `<span class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-xl md:text-2xl drop-shadow-lg leading-none mt-[2px]">❤️</span>`;
                } else {
                    let sysLower = sys.toLowerCase();
                    let iconFile = "MAME.png"; 
                    if(sysLower.includes('gba') || sysLower.includes('advance')) iconFile = 'GBA.png';
                    else if(sysLower.includes('gbc') || sysLower.includes('color')) iconFile = 'GBC.png';
                    else if(sysLower.includes('gb') || sysLower.includes('gameboy')) iconFile = 'GB.png';
                    else if(sysLower.includes('ps1') || sysLower.includes('psx') || sysLower.includes('playstation')) iconFile = 'PS.png';
                    else if(sysLower.includes('n64')) iconFile = 'N64.png';
                    else if(sysLower.includes('snes') || sysLower.includes('super')) iconFile = 'SFC.png'; 
                    else if(sysLower.includes('nes') || sysLower.includes('famicom')) iconFile = 'FC.png';
                    else if(sysLower.includes('nds') || sysLower.includes('ds')) iconFile = 'NDS.png';
                    else if(sysLower.includes('psp')) iconFile = 'PSP.png';
                    else if(sysLower.includes('md') || sysLower.includes('genesis')) iconFile = 'MD.png';
                    else if(sysLower.includes('dc') || sysLower.includes('dreamcast')) iconFile = 'DC.png';
                    
                    iconContent = `<img src="${repoBase}${iconFile}" alt="${sys}" class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-8 h-8 md:w-10 md:h-10 object-contain drop-shadow-md mt-1" onerror="this.outerHTML='<span class=\\'absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-xl leading-none\\'>🎮</span>'">`;
                }

                btn.className = `flex flex-col items-center gap-1 transition-all transform hover:scale-110 ${isActive ? 'opacity-100 scale-110' : 'opacity-50'} flex-shrink-0`;
                btn.onclick = () => applyFilter(sys);
                
                btn.innerHTML = `
                    <div class="w-10 h-10 md:w-14 md:h-14 rounded-full border-2 ${isActive ? (sys === 'Favorites' ? 'border-pink-400 bg-pink-500/30' : 'border-blue-400 bg-blue-500/30') : 'border-white/30 bg-black/50'} relative shadow-lg backdrop-blur-md overflow-hidden">
                        ${iconContent}
                    </div>
                    <span class="text-[9px] md:text-xs font-bold tracking-wider ${isActive ? (sys === 'Favorites' ? 'text-pink-300' : 'text-blue-300') : 'text-gray-400'} mt-0.5">${sys === 'Favorites' ? 'Favorit' : sys}</span>
                `;
                container.appendChild(btn);
            });
        }

        function applyFilter(sys, isSilentRefresh = false) {
            currentFilter = sys;
            
            let tempGames = [];
            if (sys === 'Favorites') {
                tempGames = allGames.filter(g => g.favorite === true);
            } else if (sys === 'All') {
                tempGames = [...allGames];
            } else {
                tempGames = allGames.filter(g => g.system === sys);
            }

            if (searchQuery !== '') {
                tempGames = tempGames.filter(g => g.title.toLowerCase().includes(searchQuery));
            }

            filteredGames = tempGames;
            
            if(!isSilentRefresh) activeGameIndex = 0;
            renderFilters();
            renderCarousel();
            
            if(filteredGames.length > 0) {
                setTimeout(() => focusGame(isSilentRefresh ? activeGameIndex : 0), 100);
            } else {
                updateEmptyState();
            }
        }

        function renderCarousel() {
            const carousel = document.getElementById('gameCarousel');
            carousel.innerHTML = ''; 
            filteredGames.forEach((game, index) => {
                const card = document.createElement('div');
                // PERUBAHAN: Memanggil class .u-game-card dari tema baru Ultoid Space!
                card.className = `u-game-card snap-center shrink-0 w-44 h-44 md:w-56 md:h-56 rounded-2xl overflow-hidden cursor-pointer shadow-xl relative bg-gray-800 flex-shrink-0 ${index === activeGameIndex ? 'active' : ''}`;
                card.onclick = () => { if (activeGameIndex === index) playActiveGame(); else focusGame(index); };
                card.id = `game-card-${index}`;
                
                const favBadge = game.favorite ? `<div class="absolute top-2 right-2 bg-pink-500/80 backdrop-blur text-white text-[10px] md:text-xs p-1 md:p-1.5 rounded-full shadow-lg z-20">❤️</div>` : '';

                const imgSrc = game.cover && game.cover !== "" ? game.cover : "https://via.placeholder.com/300x400/1e293b/ffffff?text=Mengunduh...";
                card.innerHTML = `${favBadge}<img src="${imgSrc}" class="w-full h-full object-cover pointer-events-none" alt="${game.title}">`;
                carousel.appendChild(card);
            });
        }

        function focusGame(index) {
            if(filteredGames.length === 0) return;
            
            if(index >= filteredGames.length) index = filteredGames.length - 1;
            
            activeGameIndex = index;
            const cardElement = document.getElementById(`game-card-${index}`);
            if(cardElement) cardElement.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
            
            // Mengubah penargetan ke .u-game-card
            document.querySelectorAll('.u-game-card').forEach((el, i) => { if(i === index) el.classList.add('active'); else el.classList.remove('active'); });
            
            const game = filteredGames[index];
            document.getElementById('activeGameTitle').innerText = game.title;
            document.getElementById('activeGameSystem').innerText = game.system;
            const bgSrc = game.bg && game.bg !== "" ? `url('${game.bg}')` : 'none';
            document.getElementById('switchBg').style.backgroundImage = bgSrc;
            
            updateFavoriteUI();
        }

        function updateEmptyState() {
            document.getElementById('activeGameTitle').innerText = "Tidak Ada Game";
            document.getElementById('activeGameSystem').innerText = searchQuery !== '' ? "Coba kata kunci lain" : "Koleksi masih kosong";
            document.getElementById('switchBg').style.backgroundImage = `none`;
            document.getElementById('btnFavorite').style.display = 'none';
        }

        const carousel = document.getElementById('gameCarousel');
        let scrollTimeout;
        carousel.addEventListener('scroll', () => {
            if(filteredGames.length === 0) return;
            clearTimeout(scrollTimeout);
            scrollTimeout = setTimeout(() => {
                const centerPosition = carousel.scrollLeft + (carousel.clientWidth / 2);
                let closestIndex = 0; let closestDistance = Infinity;
                // Mengubah penargetan ke .u-game-card
                document.querySelectorAll('.u-game-card').forEach((card, index) => {
                    const distance = Math.abs(centerPosition - (card.offsetLeft + (card.clientWidth / 2)));
                    if (distance < closestDistance) { closestDistance = distance; closestIndex = index; }
                });
                if (activeGameIndex !== closestIndex) focusGame(closestIndex);
            }, 100); 
        });

        carousel.addEventListener('wheel', (evt) => { evt.preventDefault(); carousel.scrollLeft += evt.deltaY * 1.5; });
        function playActiveGame() { if(filteredGames.length > 0) window.open(filteredGames[activeGameIndex].playUrl, '_self'); }
        setInterval(() => { document.getElementById('switchClock').innerText = new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' }); }, 1000);

        fetchGameDatabase();
    </script>
</body>
</html>
